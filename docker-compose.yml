# One command: `docker compose up --build`
#   API      -> http://localhost:4000
#   Mailpit  -> http://localhost:8025  (read OTP emails here)
#   Postgres -> localhost:5433
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: padosipro
      POSTGRES_PASSWORD: padosipro
      POSTGRES_DB: padosipro
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padosipro -d padosipro"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://padosipro:padosipro@db:5432/padosipro?schema=public
      # Local development placeholders. Set real secrets through the environment in any deployment.
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
      JWT_EXPIRES_IN: 7d
      OTP_SECRET: ${OTP_SECRET:-local-dev-otp-secret-change-me-0123456789}
      OTP_TTL_MINUTES: 10
      OTP_MAX_ATTEMPTS: 5
      OTP_RESEND_COOLDOWN_SECONDS: 30
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: PadosiPro <no-reply@padosipro.local>
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
